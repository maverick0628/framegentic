name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Bundle
        run: bash scripts/build.sh

      - name: Bundle smoke test
        run: |
          APP=.build/Framegentic.app
          test -x "$APP/Contents/MacOS/Framegentic"
          plutil -lint "$APP/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist")" = "true" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.duncansmith.framegentic" ]
          codesign --verify --strict "$APP"
          for f in AppIcon.icns MenuBarIcon.png MenuBarIcon@2x.png; do
            test -f "$APP/Contents/Resources/$f"
          done

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12

      - name: Build signed bundle
        env:
          SIGN_IDENTITY: "Developer ID Application"
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" > key.p8
          ditto -c -k --keepParent .build/Framegentic.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --key key.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple .build/Framegentic.app
          rm key.p8 notarize.zip

      - name: Package release artifact
        run: |
          ditto -c -k --keepParent .build/Framegentic.app "Framegentic-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 "Framegentic-${GITHUB_REF_NAME#v}.zip" > "Framegentic-${GITHUB_REF_NAME#v}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Framegentic $GITHUB_REF_NAME" \
            --generate-notes \
            "Framegentic-${GITHUB_REF_NAME#v}.zip" \
            "Framegentic-${GITHUB_REF_NAME#v}.zip.sha256"
